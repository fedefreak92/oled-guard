# Compila ed esegue i test unitari e quelli GPU (su WARP, senza scheda video).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Stesso comando usato in locale: trova Visual Studio, compila con Ninja ed esegue CTest.
      - name: Build e test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Raccolta dell'app
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\oled-guard.exe dist\
          Copy-Item -Recurse build\ui dist\ui
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md dist\

      - uses: actions/upload-artifact@v4
        with:
          name: oled-guard-windows-x64
          path: dist
