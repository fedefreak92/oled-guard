# Compila ed esegue i test unitari e quelli GPU (su WARP, senza scheda video), poi
# controlla che l'exe non dipenda dal runtime di Visual C++ e prepara lo zip di release.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Stesso comando usato in locale: trova Visual Studio, compila con Ninja ed esegue CTest.
      - name: Build e test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Controllo dell'exe e zip di release
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\package-release.ps1 -BuildDir build -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: oled-guard-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
