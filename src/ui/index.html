<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLED Guard</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="loading">
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span id="brandLogo"></span>
      <div><b>OLED Guard</b><small id="brandVersion">v-</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button id="btnNews" data-i18n-title="shell.news_title"><span id="newsIcon"></span><span data-i18n="shell.news"></span></button>
      <span class="version" id="footVersion">v-</span>
    </div>
  </aside>

  <section class="main">
    <header class="top">
      <button class="iconbtn" id="btnTopPause"></button>
      <span class="status" id="topStatus"><i class="dot"></i><span>...</span></span>
      <span class="session"><span data-i18n="shell.session"></span> · <b id="topSession">-</b></span>
      <span class="fill"></span>
      <button class="ghost-icon" id="btnTopStats" data-i18n-title="nav.statistiche"></button>
      <button class="ghost-icon" id="btnTopSettings" data-i18n-title="nav.impostazioni"></button>
      <span class="version" id="topVersion">v-</span>
      <button class="wb" data-win="minimize" data-i18n-title="shell.minimize"></button>
      <button class="wb" data-win="maximize" data-i18n-title="shell.maximize"></button>
      <button class="wb close" data-win="close" data-i18n-title="shell.close"></button>
    </header>

    <div class="content" id="content"></div>

    <footer class="strip">
      <div class="strip-head">
        <h6><i class="dot"></i><span data-i18n="strip.title"></span></h6>
        <button class="link" id="btnOpenStats" data-i18n="strip.open_stats"></button>
      </div>
      <div class="sig-tiles">
        <div class="sig risk"><div class="sig-top"><small data-i18n="strip.risk"></small><b id="sigRisk">-</b></div><div class="spark" id="sparkRisk"></div><span id="sigRiskSub">-</span></div>
        <div class="sig motion"><div class="sig-top"><small data-i18n="strip.motion"></small><b id="sigMotion">-</b></div><div class="spark" id="sparkMotion"></div><span id="sigMotionSub">-</span></div>
        <div class="sig bright"><div class="sig-top"><small data-i18n="strip.brightness"></small><b id="sigBright">-</b></div><div class="spark" id="sparkBright"></div><span id="sigBrightSub">-</span></div>
        <div class="sig sum">
          <div><b class="accent" id="sSession">-</b><small data-i18n="shell.session"></small></div>
          <div><b id="sTotal">-</b><small data-i18n="strip.total"></small></div>
          <div><b id="sPeak">-</b><small data-i18n="strip.peak24"></small></div>
          <div><b class="accent" id="sAvoided">-</b><small data-i18n="strip.avoided_today"></small></div>
        </div>
      </div>
    </footer>
  </section>
</div>
<div class="setup" id="setup" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
<script src="pages.js"></script>
<script src="setup.js"></script>
<script src="mock.js"></script>
<script src="main.js"></script>
</body>
</html>
