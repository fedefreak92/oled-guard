<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLED Guard</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span id="brandLogo"></span>
      <div><b>OLED Guard</b><small id="brandVersion">v-</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button id="btnNews" title="Novità e informazioni"><span id="newsIcon"></span>Novità</button>
      <span class="version" id="footVersion">v-</span>
    </div>
  </aside>

  <section class="main">
    <header class="top">
      <button class="iconbtn" id="btnTopPause" title="Pausa manuale"></button>
      <span class="status" id="topStatus"><i class="dot"></i><span>...</span></span>
      <span class="session">Sessione · <b id="topSession">-</b></span>
      <span class="fill"></span>
      <button class="ghost-icon" id="btnTopStats" title="Statistiche"></button>
      <button class="ghost-icon" id="btnTopSettings" title="Impostazioni"></button>
      <span class="version" id="topVersion">v-</span>
      <button class="wb" data-win="minimize" title="Riduci a icona"></button>
      <button class="wb" data-win="maximize" title="Ingrandisci"></button>
      <button class="wb close" data-win="close" title="Chiudi"></button>
    </header>

    <div class="content" id="content"></div>

    <footer class="strip">
      <div class="strip-head">
        <h6><i class="dot"></i>OGGI</h6>
        <button class="link" id="btnOpenStats">Apri statistiche ›</button>
      </div>
      <div class="tiles">
        <div class="tile"><small>Sessione</small><b class="accent" id="sSession">-</b><span>da quando l'app è aperta</span></div>
        <div class="tile"><small>Protetto oggi</small><b id="sToday">-</b><span>overlay a schermo</span></div>
        <div class="tile"><small>Totale</small><b id="sTotal">-</b><span>da sempre</span></div>
        <div class="tile"><small>Uniformità</small><b id="sUniform">-</b><span>usura fra le posizioni</span></div>
        <div class="tile"><small>Pause oggi</small><b id="sPauses">-</b><span id="sPausesSub">giochi, video, blocchi</span></div>
      </div>
    </footer>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
<script src="pages.js"></script>
<script src="mock.js"></script>
<script src="main.js"></script>
</body>
</html>
